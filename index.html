<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#07131f">
  <meta name="description" content="A SAINTCON AppSec Academy mission: learn the four parts of an AppSec program, then fund a one-year roadmap and see how it holds up against the attacks that land at the end of the year.">
  <title>AppSec Academy · Mission Commander Qualification</title>
  <link rel="stylesheet" href="./assets/styles.css">
  <link rel="stylesheet" href="./assets/commander.css">
</head>
<body>
  <a class="skip-link" href="#main">Skip to mission control</a>
  <div class="scanlines" aria-hidden="true"></div>
  <header class="topbar">
    <span class="brand">
      <img class="brand-logo" src="./assets/space-owasp.png" alt="">
      <span><strong>AppSec Academy</strong><small>SAINTCON 26</small></span>
    </span>
    <div class="status"><span class="status-dot"></span> Command system online</div>
    <button class="text-button" type="button" data-action="restart">Start over</button>
  </header>

  <main id="main" tabindex="-1"></main>

  <footer>
    <span>APPSEC ACADEMY // COMMAND NETWORK</span>
    <span>All scenarios are fictional.</span>
  </footer>

  <div id="sim-root"></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script type="module" src="./js/app.js"></script>
</body>
</html>
