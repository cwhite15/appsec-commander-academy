<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#07131f">
  <meta name="description" content="Three AppSec program missions from the SAINTCON AppSec Academy: learn the components of an AppSec program, defend a roadmap, and build your own.">
  <title>AppSec Academy · Mission Commander Qualification</title>
  <link rel="stylesheet" href="./assets/styles.css">
</head>
<body>
  <a class="skip-link" href="#main">Skip to mission control</a>
  <div class="scanlines" aria-hidden="true"></div>
  <header class="topbar">
    <a class="brand" href="#/" aria-label="AppSec Academy home">
      <img class="brand-logo" id="brand-logo" src="./assets/space-owasp.png" alt="">
      <span><strong id="academy-name">AppSec Academy</strong><small id="event-name">SAINTCON 26</small></span>
    </a>
    <div class="status"><span class="status-dot"></span> Command system online</div>
    <button class="text-button" id="reset-progress" type="button">Reset progress</button>
  </header>

  <main id="main"></main>

  <footer>
    <span>APPSEC ACADEMY // COMMAND NETWORK</span>
    <span>All scenarios are fictional. Progress and your map stay in this browser.</span>
  </footer>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <div id="print-root" aria-hidden="true"></div>
  <script type="module" src="./js/app.js"></script>
</body>
</html>
